    <style>
        /* 1. Register the font */
@font-face {
    font-family: 'Gogga';
    src: url('Gogga_Thorax.otf'); /* Make sure the filename matches exactly! */
}

/* 2. Apply it as the primary font */
body {
    background-color: black;
    color: white;
    margin: 0;
    padding-top: 80px; 
    font-family: 'Gogga', Arial, sans-serif; /* Fallback to Arial if Gogga fails */
}
        /* Global Styles */
        body {
            background-color: black;
            color: white;
            margin: 0;
            padding-top: 80px; 
            font-family: Arial, sans-serif;
            min-height: 150vh; 
        }

        /* Sticky Navigation Bar */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: #222;
            padding: 15px;
            text-align: center;
            z-index: 1000;
            border-bottom: 1px solid #444;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        .navbar a:hover {
            color: #ffcc00;
        }

        /* Top Image Container */
        .img-container {
            text-align: center;
            margin-bottom: 50px;
        }

        .responsive-img {
            width: 30%; /* Sized down to 30% */
            height: auto;
            border-radius: 10px;
        }

        /* Video and Feature Row Containers */
        .video-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin: 50px auto;
            max-width: 1100px;
            padding: 0 20px;
        }

        iframe {
            border-radius: 12px;
            border: 2px solid #333;
            max-width: 100%;
        }

        .video-text {
            flex: 1;
            text-align: left;
            min-width: 300px;
        }

        .video-text h2 {
            margin-top: 0;
            color: #ffcc00;
        }

        /* Side Image Styling */
        .side-img {
            width: 100%;
            max-width: 560px;
            border-radius: 12px;
            border: 2px solid #333;
        }

        .image-box {
            flex: 1;
            min-width: 300px;
            max-width: 560px;
        }

        /* Meta Button Styling */
        .meta-button {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 15px;
            transition: background-color 0.3s, transform 0.2s;
        }

        .meta-button:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }
    </style>
</head>
